startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - planwireApiKey
    properties:
      planwireApiKey:
        type: string
        description: Get a free sandbox key at https://planwire.io/?utm_source=smithery&utm_medium=directory&utm_campaign=mcp.
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'planwire-mcp'],
      env: { PLANWIRE_API_KEY: config.planwireApiKey }
    })
